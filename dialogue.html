<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma journée — dialogue & dictée des verbes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Spectral:wght@300;400;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCFCF8; --rule-faint:#E3E8F4; --rule:#AEBBDE;
  --ink:#1E2A4A; --ink-soft:#5A6685;
  --pen:#C42B2B; --tick:#1B6B50;
  --gap:8mm;
  --display:"Fraunces",Georgia,serif;
  --body:"Spectral",Georgia,serif;
  --hand:"Caveat",cursive;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#EDEEE8; color:var(--ink);
  font-family:var(--body); line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding:clamp(12px,3vw,40px);
}
.sheet{
  max-width:720px; margin:0 auto; background:
    repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--gap) - 1px), var(--rule-faint) calc(var(--gap) - 1px), var(--rule-faint) var(--gap)),
    repeating-linear-gradient(to right, transparent 0, transparent calc(var(--gap) - 1px), var(--rule-faint) calc(var(--gap) - 1px), var(--rule-faint) var(--gap)),
    repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--gap)*4 - 1px), var(--rule) calc(var(--gap)*4 - 1px), var(--rule) calc(var(--gap)*4)),
    var(--paper);
  border:1px solid #D8D9CF; border-radius:3px;
  box-shadow:0 2px 0 #D8D9CF, 0 14px 34px rgba(30,42,74,.10);
  padding:clamp(20px,4vw,44px) clamp(18px,5vw,52px);
  position:relative;
}
.sheet::before{content:""; position:absolute; top:0; bottom:0; left:clamp(10px,3vw,34px); width:1px; background:#E4B8B8;}
h1{font-family:var(--display); font-weight:600; font-size:clamp(1.5rem,4vw,2.1rem); margin:0 0 4px; letter-spacing:-.01em;}
h2{font-family:var(--display); font-weight:600; font-size:1.15rem; margin:30px 0 8px; color:var(--pen)}
.sub{color:var(--ink-soft); margin:0 0 26px; font-size:.95rem}
.hide{display:none !important}
.modes{display:flex; flex-direction:column; gap:10px; margin:22px 0}
.modes button{
  font-family:var(--body); font-size:1.02rem; text-align:left;
  background:#fff; border:1.5px solid var(--rule); border-radius:6px;
  padding:12px 16px; cursor:pointer; color:var(--ink);
}
.modes button:hover{border-color:var(--ink)}
.modes button b{font-family:var(--display); font-weight:600}
.modes button small{display:block; color:var(--ink-soft); margin-top:2px}
.nav{display:flex; gap:10px; margin-top:26px; flex-wrap:wrap}
.nav button{font-family:var(--body); font-size:.95rem; background:var(--ink); color:#fff; border:none; border-radius:6px; padding:10px 22px; cursor:pointer;}
.nav button.ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--rule)}

/* interview */
.iq{margin:0 0 22px; padding-bottom:16px; border-bottom:1px dashed var(--rule-faint)}
.iq .fr{font-size:1.12rem; margin:0 0 2px}
.iq .fr b{font-family:var(--display)}
.iq .en{color:var(--ink-soft); font-size:.88rem; margin:0 0 8px}
.iq .hint{font-size:.88rem; color:var(--tick); font-family:var(--hand); font-size:1.15rem}
.iq button.rev{
  font-family:var(--body); font-size:.85rem; background:transparent; color:var(--pen);
  border:1px solid #E7C7C7; border-radius:999px; padding:2px 12px; cursor:pointer; margin-top:4px;
}
.iq .model{margin-top:8px; padding:10px 14px; background:#F4FAF7; border-left:3px solid var(--tick); border-radius:0 6px 6px 0; font-size:.97rem}

/* drill */
.meta{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; font-size:.9rem; color:var(--ink-soft)}
.bar{height:4px; background:#E7E9E0; border-radius:2px; overflow:hidden; margin-bottom:26px}
.bar i{display:block; height:100%; background:var(--ink); width:0%; transition:width .25s}
.speaker{font-family:var(--hand); font-size:1.3rem; color:var(--ink-soft)}
.line{font-size:1.15rem; margin:6px 0 18px}
.line b{font-family:var(--display)}
.inf{color:var(--pen); font-style:italic; font-size:.95em}
input.blank{
  font-family:var(--body); font-size:1.05rem; color:var(--ink);
  border:none; border-bottom:2px solid var(--rule); background:transparent;
  width:150px; padding:2px 6px; outline:none; text-align:center;
}
input.blank:focus{border-bottom-color:var(--ink)}
input.blank.ok{border-bottom-color:var(--tick); color:var(--tick)}
input.blank.ko{border-bottom-color:var(--pen); color:var(--pen)}
.keypad{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0}
.keypad button{
  font-family:var(--body); font-size:1.05rem; background:#fff; border:1.5px solid var(--rule);
  border-radius:6px; width:38px; height:36px; cursor:pointer; color:var(--ink);
}
.keypad button:hover{border-color:var(--ink)}
.expl{margin-top:16px; padding:14px 16px; border-left:3px solid var(--pen); background:#FDF9F4; font-size:.97rem; border-radius:0 6px 6px 0;}
.expl.good{border-left-color:var(--tick); background:#F4FAF7}
.expl .verdict{font-family:var(--hand); font-size:1.35rem; display:block; margin-bottom:2px}
.expl.good .verdict{color:var(--tick)}
.expl:not(.good) .verdict{color:var(--pen)}
.score-line{font-family:var(--display); font-size:clamp(1.6rem,5vw,2.3rem); margin:6px 0 2px}
.verdict-line{font-family:var(--hand); font-size:1.5rem; color:var(--pen); margin:0 0 20px}
.missed-list{font-size:.95rem}
.missed-list li{margin-bottom:6px}
@media (max-width:520px){ .sheet::before{display:none} input.blank{width:120px} }
</style>
</head>
<body data-page="dialogue">
<nav class="topnav"></nav>
<div class="sheet">

  <div id="start">
    <h1>Ma journée</h1>
    <p class="sub">Deux outils : l'interview pour parler, la dictée pour écrire les verbes.</p>
    <div class="modes">
      <button id="mInt"><b>1 · L'interview</b><small>15 questions sur ta journée et tes week-ends — réponds à voix haute, puis compare avec un exemple.</small></button>
      <button id="mDrill"><b>2 · La dictée des verbes</b><small>Le même dialogue, réponses complètes — mais les verbes sont à taper. 32 blancs, accents obligatoires.</small></button>
    </div>
  </div>

  <!-- ============ INTERVIEW ============ -->
  <div id="interview" class="hide">
    <h1>L'interview</h1>
    <p class="sub">Réponds à voix haute, en phrases complètes. Utilise <b>tout d'abord, puis, après, enfin</b>. Clique « exemple » seulement après avoir répondu.</p>
    <div id="iqs"></div>
    <div class="nav"><button class="ghost" id="backInt">← Menu</button></div>
  </div>

  <!-- ============ DRILL ============ -->
  <div id="drill" class="hide">
    <div class="meta"><span id="pos"></span><span id="scoreLive"></span></div>
    <div class="bar"><i id="fill"></i></div>
    <p class="speaker" id="who"></p>
    <p class="line" id="line"></p>
    <div class="keypad" id="keypad"></div>
    <div class="expl hide" id="expl"></div>
    <div class="nav">
      <button id="check">Vérifier</button>
      <button id="next" class="hide">Suivant →</button>
      <button class="ghost" id="quit">Menu</button>
    </div>
  </div>

  <div id="results" class="hide">
    <h1>Résultats</h1>
    <div class="score-line" id="score"></div>
    <p class="verdict-line" id="verdict"></p>
    <h2 id="mhead" class="hide">À revoir</h2>
    <ul class="missed-list" id="mlist"></ul>
    <div class="nav">
      <button id="errBtn" class="hide"></button>
      <button class="ghost" id="again">Menu</button>
    </div>
  </div>

</div>

<script>
const $=id=>document.getElementById(id);

/* ============ INTERVIEW QUESTIONS ============ */
const IQ=[
{fr:"Tu te réveilles à quelle heure le matin ?",en:"What time do you wake up?",hint:"je me réveille à…",model:"Je me réveille à 6 heures et demie, mais je me lève vers 7 heures moins le quart."},
{fr:"Qu'est-ce que tu fais tout d'abord, après te lever ?",en:"What do you do first, after getting up?",hint:"tout d'abord, je…",model:"Tout d'abord, je me douche, puis je me rase et après, je m'habille."},
{fr:"Tu prends un petit-déjeuner ? Qu'est-ce que tu manges ?",en:"Do you have breakfast? What do you eat?",hint:"je prends… / je bois…",model:"Oui, je prends un petit-déjeuner simple : je mange du riz et je bois un café."},
{fr:"Tu pars au travail à quelle heure ? Comment ?",en:"When do you leave for work? How do you get there?",hint:"je pars à… / je prends…",model:"Je pars au travail à 8 heures. Je prends la moto parce qu'il y a beaucoup de circulation."},
{fr:"Tu commences le travail à quelle heure ? Et tu finis quand ?",en:"When do you start work? When do you finish?",hint:"je commence à… / je finis à…",model:"Je commence à 9 heures et je finis à 18 heures, mais parfois je finis plus tard."},
{fr:"Qu'est-ce que tu fais comme travail ?",en:"What do you do for work?",hint:"je travaille dans… / je suis…",model:"Je travaille dans l'informatique. Je réponds aux problèmes des serveurs et j'aide les clients."},
{fr:"Où est-ce que tu déjeunes ? Avec qui ?",en:"Where do you have lunch? With whom?",hint:"je déjeune à/avec…",model:"Je déjeune près du bureau avec mes collègues. On mange vite et on boit un café après."},
{fr:"Qu'est-ce que tu fais le soir, après le travail ?",en:"What do you do in the evening after work?",hint:"après le travail, je…",model:"Après le travail, je rentre à la maison, je dîne vers 20 heures, puis j'étudie le français."},
{fr:"Tu étudies le français quand ? Combien de temps ?",en:"When do you study French? For how long?",hint:"j'étudie… pendant…",model:"J'étudie le français le soir, pendant une heure. Je regarde des vidéos et je fais des exercices."},
{fr:"Tu te couches à quelle heure ? Tu dors bien ?",en:"What time do you go to bed? Do you sleep well?",hint:"je me couche à… / je dors…",model:"Je me couche vers 23 heures et demie. Je dors sept heures environ — parfois je réfléchis trop et je dors mal !"},
{fr:"Qu'est-ce que tu fais le week-end, en général ?",en:"What do you do on weekends, generally?",hint:"le samedi, je… / le dimanche, je…",model:"Le samedi matin, je dors ! Après, je sors avec mes amis ou je fais du sport. Le dimanche, je reste à la maison et je lis."},
{fr:"Tu sors souvent avec tes amis ? Vous faites quoi ?",en:"Do you go out often with friends? What do you do?",hint:"on va… / on boit… / on mange…",model:"Oui, on sort le samedi soir. On va au café, on boit quelque chose et on parle pendant des heures."},
{fr:"Tu fais du sport ? Quel sport ?",en:"Do you do any sport? Which one?",hint:"je fais du/de la… / je cours…",model:"Je cours le dimanche matin et parfois je fais de la natation. Je veux courir plus souvent !"},
{fr:"Qu'est-ce que tu veux faire plus tard ? Tu as un projet ?",en:"What do you want to do later? Any plans?",hint:"je veux… / j'espère…",model:"Je veux vivre au Canada. J'espère réussir mon examen de français et je crois que c'est possible !"},
{fr:"Décris ta journée idéale, du matin au soir.",en:"Describe your ideal day, morning to night.",hint:"tout d'abord… puis… après… enfin…",model:"Tout d'abord, je me réveille tard, sans réveil. Puis je prends un grand petit-déjeuner. Après, je sors, je vois mes amis et on déjeune ensemble. Enfin, le soir, je lis un peu et je me couche tôt."},
];

function buildInterview(){
  const box=$('iqs'); box.innerHTML='';
  IQ.forEach((q,n)=>{
    const d=document.createElement('div');
    d.className='iq';
    d.innerHTML='<p class="fr"><b>'+(n+1)+'.</b> '+q.fr+'</p>'
      +'<p class="en">'+q.en+'</p>'
      +'<span class="hint">'+q.hint+'</span><br>'
      +'<button class="rev">exemple de réponse</button>'
      +'<div class="model hide">'+q.model+'</div>';
    d.querySelector('.rev').onclick=e=>{
      d.querySelector('.model').classList.toggle('hide');
      e.target.textContent = d.querySelector('.model').classList.contains('hide') ? 'exemple de réponse' : 'cacher';
    };
    box.appendChild(d);
  });
}

/* ============ DRILL : dialogue with typed blanks ============ */
/* a: accepted answers (lowercase, exact accents) | e: English explanation */
const D=[
{w:"L'intervieweur",t:"Bonjour ! Tu [te réveiller] à quelle heure le matin ?",a:["te réveilles"],e:"Tu te réveilles — reflexive pronoun te + -es ending (1er groupe). The pronoun must match tu."},
{w:"Moi",t:"Je [se réveiller] à 6 heures et demie.",a:["me réveille"],e:"Je me réveille — the pronoun switches to ME because the subject is je. Never 'je se réveille'."},
{w:"Moi",t:"Mais je [se lever] vers 7 heures !",a:["me lève"],e:"Je me lève — acheter-family: è in the boot (lever → lève). 'Me leve' without the accent is the classic miss."},
{w:"L'intervieweur",t:"Qu'est-ce que tu fais après ?",a:null},
{w:"Moi",t:"Tout d'abord, je [se doucher], puis je [s'habiller].",a:["me douche","m'habille"],e:"Je me douche (regular -er) and je m'habille — me elides to m' before the vowel h. Both pronouns match je."},
{w:"Moi",t:"Après, je [prendre] le petit-déjeuner : je [boire] un café.",a:["prends","bois"],e:"Je prends (silent d + s) and je bois (boi- stem for singulars). Nous would be buvons — three stems for boire."},
{w:"L'intervieweur",t:"Tu [partir] au travail à quelle heure ?",a:["pars"],e:"Tu pars — partir-family drops the t in singular forms: pars, pars, part. 'Partis' would be past."},
{w:"Moi",t:"Je [partir] à 8 heures et je [aller] au bureau en moto.",a:["pars","vais"],e:"Je pars, je vais. Aller is hyper-irregular: vais, vas, va, allons, allez, vont — the only -er verb in the 3e groupe."},
{w:"L'intervieweur",t:"Le travail [commencer] à quelle heure ?",a:["commence"],e:"Le travail commence — il/elle form of a regular -er verb. (Fun trap you dodged: nous commençons takes ç, but not here.)"},
{w:"Moi",t:"Je commence à 9 heures et je [finir] à 18 heures.",a:["finis"],e:"Je finis — 2e groupe: -is, -is, -it. Je and tu are identical (finis); il takes finit."},
{w:"Moi",t:"Mes collègues et moi, nous [finir] souvent plus tard !",a:["finissons"],e:"Nous finissons — the plural stem finiss- with double s. The -iss- infix is the 2e groupe signature."},
{w:"L'intervieweur",t:"Qu'est-ce que tu fais comme travail ?",a:null},
{w:"Moi",t:"Je [répondre] aux problèmes des serveurs.",a:["réponds"],e:"Je réponds — répondre-family keeps the d: -ds, -ds, -d. And don't forget the accent: rÉponds."},
{w:"Moi",t:"Les clients [attendre] toujours une réponse rapide !",a:["attendent"],e:"Ils/les clients attendent — plural of the -dre family: attend + ent. Remember: il attend has NO t after the d."},
{w:"L'intervieweur",t:"Et le soir, qu'est-ce que tu fais ?",a:null},
{w:"Moi",t:"Après le travail, je [rentrer] à la maison vers 19 heures.",a:["rentre"],e:"Je rentre — regular -er verb: -e ending. Rentrer = go back home."},
{w:"Moi",t:"On [dîner] vers 20 heures, puis j'[étudier] le français.",a:["dîne","étudie"],e:"On dîne — on takes the il/elle form (-e). J'étudie — regular -er, and keep the accent on étudie... actually the é is in the stem: Étudie."},
{w:"Moi",t:"Le professeur [répéter] les mots et moi, je [répéter] après lui.",a:["répète","répète"],e:"Both are boot forms: é→è before the silent ending → répète (il and je are identical here). Nous répétons would keep é."},
{w:"Moi",t:"J'[espérer] réussir mon examen de français !",a:["espère"],e:"J'espère — espérer-family, é→è in the boot. 'Réussir' stays infinitive after the conjugated verb."},
{w:"L'intervieweur",t:"Tu [se coucher] tard ?",a:["te couches"],e:"Tu te couches — reflexive, pronoun te matches tu, regular -er endings."},
{w:"Moi",t:"Je [se coucher] vers 23 heures et je [dormir] sept heures.",a:["me couche","dors"],e:"Je me couche (pronoun me) and je dors — dormir drops the m in singulars: dors, dors, dort, then dormons brings it back."},
{w:"Moi",t:"Parfois je [réfléchir] trop et je dors mal !",a:["réfléchis"],e:"Je réfléchis — 2e groupe (réfléchissant ✓): -is. All three accents matter: rÉflÉchis."},
{w:"L'intervieweur",t:"Parle-moi de ton week-end ! Tu [sortir] souvent ?",a:["sors"],e:"Tu sors — partir-family: sortir → sors, sors, sort. The t of the stem returns in the plural: sortons."},
{w:"Moi",t:"Oui ! Le samedi, mes amis et moi, nous [sortir] le soir.",a:["sortons"],e:"Nous sortons — plural restores the full stem sort-. Singular je sors vs plural nous sortons: 2 bases."},
{w:"Moi",t:"On [aller] au café, on [boire] quelque chose et on parle !",a:["va","boit"],e:"On va, on boit — ON ALWAYS takes il/elle forms even when it means 'we'. 'On allons' is the classic error."},
{w:"Moi",t:"Mes amis [vouloir] toujours rester tard, mais moi je [vouloir] rentrer !",a:["veulent","veux"],e:"Ils veulent (veul- stem) vs je veux (-x, not -s!). Pouvoir and vouloir take x for je/tu: peux, veux."},
{w:"L'intervieweur",t:"Tu [faire] du sport ?",a:["fais"],e:"Tu fais — faire: fais, fais, fait... and the famous vous FAITES (never faisez)."},
{w:"Moi",t:"Je [courir] le dimanche matin et parfois nous [faire] de la natation.",a:["cours","faisons"],e:"Je cours (cour- + s) and nous faisons — pronounced 'fe-zons', one of French's little pronunciation betrayals."},
{w:"Moi",t:"Le dimanche après-midi, je [lire] ou je [écrire] à ma famille.",a:["lis","écris"],e:"Je lis, j'écris — both singular forms are bare stems + s. Plurals grow: lisons (s), écrivons (v)."},
{w:"L'intervieweur",t:"Un dernier mot : qu'est-ce que tu [vouloir] faire plus tard ?",a:["veux"],e:"Tu veux — the -x ending again. Je veux, tu veux, il veut."},
{w:"Moi",t:"Je [vouloir] vivre au Canada. Je [croire] que c'est possible !",a:["veux","crois"],e:"Je veux (x!) and je crois — croire: crois, crois, croit, croyons, croyez, CROIENT (never 'croivent')."},
{w:"Moi",t:"Enfin, je [devoir] réussir le TCF... et je [pouvoir] le faire !",a:["dois","peux"],e:"Je dois (devoir: dois, dois, doit) and je peux (-x). Both followed by infinitives — one conjugated verb per subject, the rest stay in -er/-ir/-re form."},
];

/* flatten: build steps only for lines with blanks */
const steps=[];
D.forEach(line=>{
  if(!line.a) return;
  steps.push(line);
});

let si=0, blanks=[], checked=false, score=0, missedItems=[];

const ACC=['é','è','ê','à','ç','î','ï','ù','û','ô'];

function startDrill(list){
  drillList=list||steps;
  si=0; score=0; missedItems=[];
  checked=false;
  $('start').classList.add('hide');
  $('results').classList.add('hide');
  $('interview').classList.add('hide');
  $('drill').classList.remove('hide');
  renderStep();
  window.scrollTo({top:0,behavior:'smooth'});
}
let drillList=steps;

function renderStep(){
  const s=drillList[si];
  checked=false;
  $('pos').textContent=(si+1)+" / "+drillList.length;
  $('scoreLive').textContent=score+" ✓";
  $('fill').style.width=(si/drillList.length*100)+"%";
  $('who').textContent="— "+s.w+" :";
  // build the line with inputs
  let idx=0;
  const html=s.t.replace(/\[([^\]]+)\]/g,(m,inf)=>{
    const h='<input class="blank" data-i="'+(idx)+'" autocomplete="off" autocapitalize="off" spellcheck="false"><span class="inf">('+inf+')</span>';
    idx++;
    return h;
  });
  $('line').innerHTML=html;
  blanks=[...$('line').querySelectorAll('input.blank')];
  blanks.forEach(b=>{
    b.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault(); checked?advanceStep():checkStep();}
    });
  });
  if(blanks[0]) blanks[0].focus();
  // keypad
  const kp=$('keypad'); kp.innerHTML='';
  ACC.forEach(c=>{
    const b=document.createElement('button');
    b.textContent=c;
    b.onclick=()=>{
      const f=document.activeElement && document.activeElement.classList.contains('blank') ? document.activeElement : blanks.find(x=>!x.value)||blanks[0];
      if(!f) return;
      const p=f.selectionStart??f.value.length;
      f.value=f.value.slice(0,p)+c+f.value.slice(p);
      f.focus(); f.setSelectionRange(p+1,p+1);
    };
    b.onmousedown=e=>e.preventDefault(); /* keep focus in input */
    kp.appendChild(b);
  });
  $('expl').classList.add('hide');
  $('check').classList.remove('hide');
  $('next').classList.add('hide');
}

const norm=v=>v.trim().toLowerCase().replace(/\s+/g,' ').replace(/[’]/g,"'");

function checkStep(){
  if(checked) return;
  const s=drillList[si];
  let allOk=true;
  blanks.forEach((b,k)=>{
    const good=norm(b.value)===norm(s.a[k]);
    b.classList.add(good?'ok':'ko');
    if(!good){ allOk=false; b.value=b.value+"  →  "+s.a[k]; }
    b.disabled=true;
  });
  checked=true;
  if(allOk) score++;
  else missedItems.push(s);
  const ex=$('expl');
  ex.className='expl '+(allOk?'good':'');
  ex.innerHTML='<span class="verdict">'+(allOk?'Bien !':'Pas tout à fait…')+'</span>'+s.e;
  ex.classList.remove('hide');
  $('check').classList.add('hide');
  const n=$('next');
  n.textContent=(si===drillList.length-1)?"Résultats →":"Suivant →";
  n.classList.remove('hide');
  n.focus();
  $('scoreLive').textContent=score+" ✓";
}

function advanceStep(){
  if(!checked) return;
  if(si===drillList.length-1){ finishDrill(); return; }
  si++; renderStep();
  window.scrollTo({top:0,behavior:'smooth'});
}

function finishDrill(){
  $('drill').classList.add('hide');
  $('results').classList.remove('hide');
  const tot=drillList.length, pct=Math.round(score/tot*100);
  $('score').textContent=score+" / "+tot+" — "+pct+"%";
  let v;
  if(pct>=90) v="Excellent — tu peux raconter ta journée sans filet.";
  else if(pct>=75) v="Solide ! Refais les lignes ratées.";
  else if(pct>=55) v="Pas mal, mais les accents et les pronoms glissent encore.";
  else v="Reprends les tableaux de conjugaison, puis reviens.";
  $('verdict').textContent=v;
  const ml=$('mlist'); ml.innerHTML='';
  if(missedItems.length){
    $('mhead').classList.remove('hide');
    missedItems.forEach(s=>{
      ml.insertAdjacentHTML('beforeend','<li>'+s.t.replace(/\[([^\]]+)\]/g,(m,inf,)=>'<b>'+s.a[s.t.slice(0,s.t.indexOf(m)).split('[').length-1]+'</b>')+'</li>');
    });
    const eb=$('errBtn');
    eb.textContent="Refaire mes erreurs ("+missedItems.length+")";
    eb.classList.remove('hide');
  } else {
    $('mhead').classList.add('hide');
    $('errBtn').classList.add('hide');
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

/* nav wiring */
$('mInt').onclick=()=>{ $('start').classList.add('hide'); buildInterview(); $('interview').classList.remove('hide'); window.scrollTo({top:0,behavior:'smooth'}); };
$('mDrill').onclick=()=>startDrill();
$('backInt').onclick=()=>{ $('interview').classList.add('hide'); $('start').classList.remove('hide'); };
$('check').onclick=checkStep;
$('next').onclick=advanceStep;
$('quit').onclick=()=>{ $('drill').classList.add('hide'); $('start').classList.remove('hide'); };
$('again').onclick=()=>{ $('results').classList.add('hide'); $('start').classList.remove('hide'); };
$('errBtn').onclick=()=>{ const m=missedItems.slice(); startDrill(m); };
</script>
<script src="assets/manifest.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
